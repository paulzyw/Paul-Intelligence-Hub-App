name: RevOS Content Publishing SSG

on:
  repository_dispatch:
    types:
      - rebuild-revos-content
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revos-content-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy-ssg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Download pristine watch model files
        run: |
          mkdir -p public/models
          curl -L "https://ciechanow.ski/models/watch_vertices.dat?v=2" -o public/models/watch_vertices.dat
          curl -L "https://ciechanow.ski/models/watch_indices.dat?v=2" -o public/models/watch_indices.dat

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend client & server bundles
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Validate SEO and SSG output
        run: npm run validate:seo

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          export WASMER_TOKEN=$(echo -n "$WASMER_TOKEN" | tr -d '\n\r ')
          sed -i "s/version = \".*\"/version = \"0.1.${{ github.run_number }}\"/" wasmer.toml
          wasmer deploy --non-interactive --owner paulzyw02
