name: Deploy to Wasmer

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Cache or download pristine 3D model assets
        run: node scripts/download-assets.js

      - name: Build production application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Validate build artifacts
        run: |
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
          test -d dist/assets || (echo "Missing dist/assets" && exit 1)
          echo "Verified: Core production bundle and SSG artifacts successfully validated."

      - name: Setup Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          export WASMER_TOKEN=$(echo -n "$WASMER_TOKEN" | tr -d '\n\r ')
          sed -i "s/version = \".*\"/version = \"0.1.${{ github.run_number }}\"/" wasmer.toml
          wasmer deploy --non-interactive --owner paulzyw02
